<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f4f8;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .task-form {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #34495e;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background-color: #3498db;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background-color: #2980b9; }

        #taskList { list-style: none; padding: 0; }
        .task-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: opacity 0.3s, transform 0.2s;
            flex-wrap: wrap;
        }
        .task-item .edit-input {
            width: auto;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
        }
        .task-item .edit-title {
            flex: 1;
            min-width: 120px;
        }
        .task-item.completed {
            opacity: 0.6;
        }
        .task-item.completed .task-title {
            text-decoration: line-through;
            color: #7f8c8d;
        }
        .task-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            cursor: pointer;
        }
        .priority-high { border-left: 5px solid #e74c3c; }
        .priority-medium { border-left: 5px solid #f39c12; }
        .priority-low { border-left: 5px solid #27ae60; }
        
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            width: auto;
            margin-top: 0;
            transition: transform 0.2s, color 0.2s;
        }
        .action-btn:hover {
            transform: scale(1.15);
            background: none;
        }
        .edit-btn {
            color: #3498db;
            margin-left: 10px;
        }
        .edit-btn:hover {
            color: #2980b9;
        }
        .delete-btn {
            color: #e74c3c;
            margin-left: 5px;
        }
        .delete-btn:hover {
            color: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Student Task Manager</h1>
        <p class="subtitle">Stay organized • Finish on time</p>
        
        <div class="task-form">
            <h2>Add New Task</h2>
            <div class="form-group">
                <label>Task Title</label>
                <input type="text" id="taskTitle" placeholder="Enter task title">
            </div>
            <div class="form-group">
                <label>Due Date</label>
                <input type="date" id="taskDate">
            </div>
            <div class="form-group">
                <label>Priority</label>
                <select id="taskPriority">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            <button onclick="addTask()">+ Add Task</button>
        </div>

        <h2>Your Tasks</h2>
        <ul id="taskList">
            <!-- Tasks will be dynamically rendered here -->
        </ul>
    </div>

    <script>
        // Sample default tasks to show on first load
        const defaultTasks = [
            { id: 1, title: "Complete resume optimization for internship applications", date: "2026-05-20", priority: "Medium", completed: false },
            { id: 2, title: "Study Computer Networks for exam", date: "2026-05-18", priority: "High", completed: false }
        ];

        // Retrieve tasks from localStorage or initialize with defaults
        let tasks = JSON.parse(localStorage.getItem('student_tasks'));
        if (!tasks) {
            tasks = defaultTasks;
            saveTasks();
        }

        // Track which task ID is currently being edited
        let editingTaskId = null;

        // Save tasks array to local storage
        function saveTasks() {
            localStorage.setItem('student_tasks', JSON.stringify(tasks));
        }

        // Format date string from YYYY-MM-DD to "D MMM"
        function formatDate(dateStr) {
            if (!dateStr) return "No due date";
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            
            const monthIndex = parseInt(parts[1], 10) - 1;
            const day = parseInt(parts[2], 10);
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            
            return `${day} ${months[monthIndex]}`;
        }

        // Helper to get priority color style
        function getPriorityColor(priority) {
            if (priority === "High") return "#e74c3c";
            if (priority === "Medium") return "#f39c12";
            return "#27ae60";
        }

        // Render the task list to the DOM
        function renderTasks() {
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = "";

            if (tasks.length === 0) {
                taskList.innerHTML = `
                    <li class="task-item" style="justify-content: center; color: #7f8c8d; font-style: italic;">
                        No tasks available. Add some tasks above!
                    </li>`;
                return;
            }

            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-item priority-${task.priority.toLowerCase()}`;
                if (task.completed) {
                    li.classList.add('completed');
                }

                if (task.id === editingTaskId) {
                    li.innerHTML = `
                        <input type="text" class="edit-input edit-title" id="editTitle-${task.id}" value="${task.title}" placeholder="Task title">
                        <input type="date" class="edit-input" id="editDate-${task.id}" value="${task.date || ''}">
                        <select class="edit-input" id="editPriority-${task.id}">
                            <option value="Low" ${task.priority === 'Low' ? 'selected' : ''}>Low</option>
                            <option value="Medium" ${task.priority === 'Medium' ? 'selected' : ''}>Medium</option>
                            <option value="High" ${task.priority === 'High' ? 'selected' : ''}>High</option>
                        </select>
                        <button class="action-btn" onclick="saveEdit(${task.id})" style="color: #27ae60; margin-left: auto;" title="Save">💾</button>
                        <button class="action-btn" onclick="cancelEdit()" style="color: #7f8c8d;" title="Cancel">❌</button>
                    `;
                } else {
                    li.innerHTML = `
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
                        <span class="task-title">${task.title}</span>
                        <span style="margin-left: auto; color: ${getPriorityColor(task.priority)}; font-size: 14px; white-space: nowrap;">
                            ${task.priority} • ${formatDate(task.date)}
                        </span>
                        <button class="action-btn edit-btn" onclick="editTask(${task.id})" title="Edit Task">✏️</button>
                        <button class="action-btn delete-btn" onclick="deleteTask(${task.id})" title="Delete Task">🗑️</button>
                    `;
                }
                taskList.appendChild(li);
            });
        }

        // Add a new task
        function addTask() {
            const titleInput = document.getElementById('taskTitle');
            const dateInput = document.getElementById('taskDate');
            const priorityInput = document.getElementById('taskPriority');

            const title = titleInput.value.trim();
            const date = dateInput.value;
            const priority = priorityInput.value;

            if (title === "") {
                alert("Please enter a task title!");
                return;
            }

            const newTask = {
                id: Date.now(),
                title: title,
                date: date,
                priority: priority,
                completed: false
            };

            tasks.push(newTask);
            saveTasks();
            renderTasks();

            // Clear inputs
            titleInput.value = "";
            dateInput.value = "";
            priorityInput.value = "Medium";
        }

        // Toggle the completion status of a task
        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    return { ...task, completed: !task.completed };
                }
                return task;
            });
            saveTasks();
            renderTasks();
        }

        // Enable editing mode for a task
        function editTask(id) {
            editingTaskId = id;
            renderTasks();
        }

        // Cancel editing mode
        function cancelEdit() {
            editingTaskId = null;
            renderTasks();
        }

        // Save edited task details
        function saveEdit(id) {
            const titleInput = document.getElementById(`editTitle-${id}`);
            const dateInput = document.getElementById(`editDate-${id}`);
            const priorityInput = document.getElementById(`editPriority-${id}`);

            const newTitle = titleInput.value.trim();
            const newDate = dateInput.value;
            const newPriority = priorityInput.value;

            if (newTitle === "") {
                alert("Please enter a task title!");
                return;
            }

            tasks = tasks.map(task => {
                if (task.id === id) {
                    return { ...task, title: newTitle, date: newDate, priority: newPriority };
                }
                return task;
            });

            saveTasks();
            editingTaskId = null;
            renderTasks();
        }

        // Delete a task from the list
        function deleteTask(id) {
            if (confirm("Are you sure you want to delete this task?")) {
                tasks = tasks.filter(task => task.id !== id);
                saveTasks();
                renderTasks();
            }
        }

        // Initial rendering of the tasks
        renderTasks();
    </script>
</body>
</html>
